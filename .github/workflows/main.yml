name: Deploy Loom-ish to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # appleboy/scp-action v1 has no exclude input; strip VCS metadata so
      # stale .git objects on the server can never break the untar step.
      - name: Strip VCS metadata
        run: rm -rf .git .github

      - name: Deploy Loom-ish
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.hostinger_host }}
          username: ${{ secrets.hostinger_username }}
          password: ${{ secrets.name_password }}
          port: ${{ secrets.hostinger_port }}
          source: "."
          target: "domains/builtbylt.com/public_html/loom-ish"
          overwrite: true
          rm: false
